name: RabbitMQ Handler CI

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PostgreSQL and RabbitMQ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Configure Kubernetes
      # ---------------------------------------------------------
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Debug kubeconfig
        run: |
          echo "HOME=$HOME"
          echo "KUBECONFIG=$KUBECONFIG"

          ls -lah ~/.kube || true

          echo "---------------- CONFIG ----------------"
          cat ~/.kube/config || true
          echo "----------------------------------------"

          kubectl config view
          kubectl config current-context || true
      # ---------------------------------------------------------
      # Test Kubernetes connection
      # ---------------------------------------------------------
      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ---------------------------------------------------------
      # Create CI namespace
      # ---------------------------------------------------------
      - name: Create CI namespace
        run: |
          kubectl create namespace ci \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # Deploy PostgreSQL and RabbitMQ
      # ---------------------------------------------------------
      - name: Deploy PostgreSQL and RabbitMQ
        run: |
          kubectl apply -f k8s/postgresql.yaml -n ci
          kubectl apply -f k8s/rabbitmq.yaml -n ci

      # ---------------------------------------------------------
      # Wait for PostgreSQL
      # ---------------------------------------------------------
      - name: Deploy PostgreSQL and RabbitMQ
        run: |
          kubectl apply -f .github/workflows/k8s/postgresql.yaml -n ci
          kubectl apply -f .github/workflows/k8s/rabbitmq.yaml -n ci

      # ---------------------------------------------------------
      # Show Kubernetes resources
      # ---------------------------------------------------------
      - name: Show Kubernetes resources
        run: |
          kubectl get deployments -n ci
          kubectl get pods -n ci
          kubectl get services -n ci

      # ---------------------------------------------------------
      # Upload manifests
      # ---------------------------------------------------------
      - name: Upload Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: k8s/