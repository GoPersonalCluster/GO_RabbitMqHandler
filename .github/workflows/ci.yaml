name: RabbitMQ Handler CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    needs: build
    name: Build CI Image
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GO_PERSONAL_CLUSTER_ACTOR }}
          password: ${{ secrets.GO_PERSONAL_CLUSTER_TOKEN }}

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build CI image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t ${{ steps.image.outputs.name }} \
            .

      - name: Push CI image
        run: |
          docker push ${{ steps.image.outputs.name }}

      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"

          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: cloud-kubernetes
            cluster:
              server: ${{ secrets.K8S_SERVER }}
              certificate-authority-data: ${{ secrets.K8S_CA }}

          users:
          - name: github-actions
            user:
              token: ${{ secrets.K8S_TOKEN }}

          contexts:
          - name: github-actions
            context:
              cluster: cloud-kubernetes
              user: github-actions
              namespace: ci

          current-context: github-actions
          EOF

      - name: Test Kubernetes connection
        run: |
          kubectl get nodes

      - name: Replace image tag in Kubernetes manifest
        run: |
          sed -i "s/IMAGE_TAG/${GITHUB_SHA}/g" k8s/ci-job.yaml

      - name: Apply Kubernetes Job
        run: |
          kubectl apply -f k8s/ci-job.yaml

      - name: Upload Kubernetes Job manifest
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-ci-manifest
          path: k8s/ci-job.yaml