name: RabbitMQ Handler CI

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PostgreSQL and RabbitMQ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Configure Kubernetes
      # ---------------------------------------------------------
      - name: Configure Kubernetes
        env:
          K8S_SERVER: ${{ vars.GO_PERSONAL_CLUSTER_K8S_SERVER }}
          K8S_CERT: ${{ secrets.GO_PERSONAL_CLUSTER_K8S_CERT }}
          K8S_TOKEN: ${{ secrets.GO_PERSONAL_CLUSTER_K8S_TOKEN }}
        run: |
          mkdir -p "$HOME/.kube"

          printf '%s' "$K8S_CERT" > "$HOME/.kube/ca.crt"

          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config

          clusters:
            - name: cloud-kubernetes
              cluster:
                server: ${K8S_SERVER}
                certificate-authority: ${HOME}/.kube/ca.crt

          users:
            - name: github-actions
              user:
                token: ${K8S_TOKEN}

          contexts:
            - name: github-actions
              context:
                cluster: cloud-kubernetes
                user: github-actions
                namespace: ci

          current-context: github-actions
          EOF

          chmod 600 "$HOME/.kube/config"

      # ---------------------------------------------------------
      # Test Kubernetes connection
      # ---------------------------------------------------------
      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ---------------------------------------------------------
      # Create CI namespace
      # ---------------------------------------------------------
      - name: Create CI namespace
        run: |
          kubectl create namespace ci \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # Deploy PostgreSQL and RabbitMQ
      # ---------------------------------------------------------
      - name: Deploy PostgreSQL and RabbitMQ
        run: |
          kubectl apply -f k8s/postgresql.yaml -n ci
          kubectl apply -f k8s/rabbitmq.yaml -n ci

      # ---------------------------------------------------------
      # Wait for PostgreSQL
      # ---------------------------------------------------------
      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            deployment/postgresql \
            -n ci \
            --timeout=180s

      # ---------------------------------------------------------
      # Wait for RabbitMQ
      # ---------------------------------------------------------
      - name: Wait for RabbitMQ
        run: |
          kubectl rollout status \
            deployment/rabbitmq \
            -n ci \
            --timeout=180s

      # ---------------------------------------------------------
      # Show Kubernetes resources
      # ---------------------------------------------------------
      - name: Show Kubernetes resources
        run: |
          kubectl get deployments -n ci
          kubectl get pods -n ci
          kubectl get services -n ci

      # ---------------------------------------------------------
      # Upload manifests
      # ---------------------------------------------------------
      - name: Upload Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: k8s/