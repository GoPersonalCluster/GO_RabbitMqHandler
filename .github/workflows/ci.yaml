name: RabbitMQ Handler CI

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PostgreSQL and RabbitMQ
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Configure Kubernetes
      # ---------------------------------------------------------
      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"

          cat > "$HOME/.kube/config" <<EOF
          apiVersion: v1
          kind: Config

          clusters:
            - name: cloud-kubernetes
              cluster:
                server: ${{ vars.GO_PERSONAL_CLUSTER_K8S_SERVER }}
                certificate-authority-data: ${{ secrets.GO_PERSONAL_CLUSTER_K8S_CERT }}

          users:
            - name: github-actions
              user:
                token: ${{ secrets.GO_PERSONAL_CLUSTER_K8S_TOKEN }}

          contexts:
            - name: github-actions
              context:
                cluster: cloud-kubernetes
                user: github-actions
                namespace: ci

          current-context: github-actions
          EOF

      # ---------------------------------------------------------
      # Test Kubernetes connection
      # ---------------------------------------------------------
      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ---------------------------------------------------------
      # Create namespace if it does not exist
      # ---------------------------------------------------------
      - name: Create CI namespace
        run: |
          kubectl create namespace ci --dry-run=client -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # Deploy PostgreSQL and RabbitMQ
      # ---------------------------------------------------------
      - name: Deploy PostgreSQL and RabbitMQ
        run: |
          kubectl apply -f k8s/postgresql.yaml
          kubectl apply -f k8s/rabbitmq.yaml

      # ---------------------------------------------------------
      # Wait for deployments
      # ---------------------------------------------------------
      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/postgresql \
            -n ci \
            --timeout=180s

      - name: Wait for RabbitMQ
        run: |
          kubectl rollout status deployment/rabbitmq \
            -n ci \
            --timeout=180s

      # ---------------------------------------------------------
      # Show deployment status
      # ---------------------------------------------------------
      - name: Show Kubernetes resources
        run: |
          kubectl get deployments -n ci
          kubectl get pods -n ci
          kubectl get services -n ci

      # ---------------------------------------------------------
      # Upload manifests
      # ---------------------------------------------------------
      - name: Upload Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: k8s/